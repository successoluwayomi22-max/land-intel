<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Left Half: Emerald Gradient -->
    <linearGradient id="lockupLeftEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Right Half: Champagne Gold Gradient -->
    <linearGradient id="lockupRightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Center Sphere Radial Gradient -->
    <radialGradient id="lockupCenterSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </radialGradient>

    <filter id="lockupPinShadow" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ICON (Centered at x=32, y=32) -->
  <g transform="translate(0, 0)">
    <!-- Architectural Cadastral Wireframe Grid -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M32 37L55 47L32 57L9 47Z"
        fill="#F8FAFC"
        fill-opacity="0.5"
        stroke="#334155"
        stroke-width="1.3"
      />
      <path d="M32 37V57" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2" />
      <path d="M20.5 42L43.5 52" stroke="#475569" stroke-width="1.1" />
      <path d="M43.5 42L20.5 52" stroke="#475569" stroke-width="1.1" />
      <path d="M14.5 44.5L26 49.5" stroke="#94A3B8" stroke-width="0.8" />
      <path d="M49.5 44.5L38 49.5" stroke="#94A3B8" stroke-width="0.8" />
      <!-- Crosshairs -->
      <path d="M9 44V50M6 47H12" stroke="#059669" stroke-width="1.1" />
      <path d="M55 44V50M52 47H58" stroke="#D97706" stroke-width="1.1" />
      <path d="M32 54V60M29 57H35" stroke="#059669" stroke-width="1.1" />
    </g>

    <!-- Ground shadow -->
    <ellipse cx="32" cy="46" rx="4" ry="1.8" fill="#0F172A" fill-opacity="0.35" />

    <!-- 3D Dual-Tone Pin -->
    <g filter="url(#lockupPinShadow)">
      <!-- Left (Emerald) -->
      <path
        d="M32 7C24.268 7 18 13.268 18 21C18 28.5 28.5 38.5 32 42V7Z"
        fill="url(#lockupLeftEmerald)"
      />
      <!-- Right (Gold) -->
      <path
        d="M32 7V42C35.5 38.5 46 28.5 46 21C46 13.268 39.732 7 32 7Z"
        fill="url(#lockupRightGold)"
      />
      <!-- Center ring -->
      <circle cx="32" cy="21" r="7.5" fill="#FFFFFF" />
      <circle cx="32" cy="21" r="4.8" fill="url(#lockupCenterSphere)" />
      <circle cx="30.5" cy="19.5" r="1.3" fill="#FFFFFF" fill-opacity="0.8" />
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(68, 0)">
    <text x="0" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
      LAND <tspan fill="#059669">INTEL</tspan>
    </text>
    <text x="1" y="49" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748B" letter-spacing="2.8">
      PROPERTY INTELLIGENCE
    </text>
  </g>
</svg>
