<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Left Half: Emerald Gradient -->
    <linearGradient id="pinLeftEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Right Half: Champagne Gold Gradient -->
    <linearGradient id="pinRightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Center Sphere Radial Gradient -->
    <radialGradient id="centerSphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </radialGradient>

    <!-- Drop Shadow Filter for Floating Pin -->
    <filter id="pinShadow" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <!-- Wireframe Grid Subtle Glow/Shadow -->
    <filter id="gridGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- ── 1. ARCHITECTURAL CADASTRAL WIREFRAME GRID (BASE) ── -->
  <g filter="url(#gridGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Isometric Outer Diamond Base -->
    <path
      d="M32 37L55 47L32 57L9 47Z"
      fill="#F8FAFC"
      fill-opacity="0.4"
      stroke="#334155"
      stroke-width="1.4"
    />

    <!-- Inner Grid Lines (Subdivided Land Plots) -->
    <!-- Axis line from top-center to bottom-center -->
    <path d="M32 37V57" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2" />
    <!-- Left-to-right cross axes -->
    <path d="M20.5 42L43.5 52" stroke="#475569" stroke-width="1.2" />
    <path d="M43.5 42L20.5 52" stroke="#475569" stroke-width="1.2" />

    <!-- Isometric Secondary Parcel Borders -->
    <path d="M14.5 44.5L26 49.5" stroke="#94A3B8" stroke-width="0.9" />
    <path d="M49.5 44.5L38 49.5" stroke="#94A3B8" stroke-width="0.9" />

    <!-- Corner Cadastral Marker Crosshairs (+) -->
    <!-- Left marker -->
    <path d="M9 44V50M6 47H12" stroke="#059669" stroke-width="1.2" />
    <!-- Right marker -->
    <path d="M55 44V50M52 47H58" stroke="#D97706" stroke-width="1.2" />
    <!-- Bottom marker -->
    <path d="M32 54V60M29 57H35" stroke="#059669" stroke-width="1.2" />
    <!-- Top-back upright survey posts -->
    <path d="M20.5 35V42" stroke="#64748B" stroke-width="1" />
    <path d="M43.5 35V42" stroke="#64748B" stroke-width="1" />
    <path d="M32 31V37" stroke="#059669" stroke-width="1.2" />
  </g>

  <!-- Ground Pin Target Shadow -->
  <ellipse cx="32" cy="46" rx="4" ry="1.8" fill="#0F172A" fill-opacity="0.35" />

  <!-- ── 2. DUAL-TONE 3D LOCATION PIN (FLOATING) ── -->
  <g filter="url(#pinShadow)">
    <!-- LEFT HALF OF PIN (Emerald Green) -->
    <path
      d="M32 7C24.268 7 18 13.268 18 21C18 28.5 28.5 38.5 32 42V7Z"
      fill="url(#pinLeftEmerald)"
    />

    <!-- RIGHT HALF OF PIN (Champagne Gold) -->
    <path
      d="M32 7V42C35.5 38.5 46 28.5 46 21C46 13.268 39.732 7 32 7Z"
      fill="url(#pinRightGold)"
    />

    <!-- Center Cutout Outer Bevel (Gold-White Accent Rim) -->
    <circle cx="32" cy="21" r="7.5" fill="#FFFFFF" />

    <!-- Center Inner Chamber Ring -->
    <!-- Left side of inner ring -->
    <path
      d="M32 14.5C28.41 14.5 25.5 17.41 25.5 21C25.5 24.59 28.41 27.5 32 27.5V14.5Z"
      fill="#047857"
      fill-opacity="0.15"
    />
    <!-- Right side of inner ring -->
    <path
      d="M32 14.5V27.5C35.59 27.5 38.5 24.59 38.5 21C38.5 17.41 35.59 14.5 32 14.5Z"
      fill="#D97706"
      fill-opacity="0.15"
    />

    <!-- CENTRAL FLOATING CORE SPHERE -->
    <circle cx="32" cy="21" r="4.8" fill="url(#centerSphereGrad)" />

    <!-- Glossy Specular Reflection on Core -->
    <circle cx="30.5" cy="19.5" r="1.3" fill="#FFFFFF" fill-opacity="0.8" />
  </g>
</svg>
