<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border accent -->
  <rect x="2" y="2" width="1196" height="626" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(80, 60)">
    <!-- Logo Icon Shield -->
    <rect width="52" height="52" rx="14" fill="#10B981"/>
    <path d="M 26 14 L 38 18.5 L 38 27 C 38 34.5 26 40 26 40 C 26 40 14 34.5 14 27 L 14 18.5 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Logo Text -->
    <text x="70" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Land<tspan fill="#34D399">Intel</tspan>
    </text>
    <text x="70" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">
      GLOBAL CADASTRAL INTELLIGENCE
    </text>

    <!-- Badge -->
    <g transform="translate(740, 6)">
      <rect width="300" height="38" rx="19" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1"/>
      <circle cx="20" cy="19" r="4" fill="#10B981"/>
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34D399" letter-spacing="0.5">
        INSTITUTIONAL DUE-DILIGENCE
      </text>
    </g>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 220)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1.5">
      <tspan x="0" y="0">Verify Property Titles &amp;</tspan>
      <tspan x="0" y="62">Avoid Land Scams Before You Pay.</tspan>
    </text>
    
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#94A3B8" letter-spacing="-0.2">
      Automated cadastral audits, beacon coordinate charting, and title certification
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#94A3B8" letter-spacing="-0.2">
      for real estate investors, institutions, and diaspora buyers worldwide.
    </text>
  </g>

  <!-- Feature Bar Footer -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <g transform="translate(0, 32)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">
        <tspan fill="#10B981" font-weight="900">✓ </tspan>15-Section Cadastral Audit
      </text>
    </g>

    <g transform="translate(260, 32)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">
        <tspan fill="#10B981" font-weight="900">✓ </tspan>Beacon Coordinate Recovery
      </text>
    </g>

    <g transform="translate(540, 32)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">
        <tspan fill="#10B981" font-weight="900">✓ </tspan>Lands Registry &amp; C of O
      </text>
    </g>

    <g transform="translate(820, 32)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">
        landintel.ai
      </text>
    </g>
  </g>
</svg>
